version: "3.8"

services:
  # --- MongoDB Database with Persistent Volume ---
  mongodb:
    image: mongo:7.0-jammy
    container_name: jansahayak-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bodhi_jansahayak
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jansahayak-net

  # --- Ollama Local Embedding Server ---
  ollama:
    image: ollama/ollama:latest
    container_name: jansahayak-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Pull the embedding model on first start
    entrypoint: ["/bin/bash", "-c", "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"]
    networks:
      - jansahayak-net

  # --- Bodhi AI Express API Backend ---
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: jansahayak-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URL=mongodb://mongodb:27017/bodhi_jansahayak
      - CLIENT_URL=http://localhost:5173,http://localhost:80,http://localhost
      - JWT_SECRET=${JWT_SECRET:-bodhi_jansahayak_production_access_token_secret_key_64_chars_min}
      - JWT_EXPIRE=15m
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-bodhi_jansahayak_production_refresh_token_secret_key_64_chars_min}
      - REFRESH_TOKEN_EXPIRE=7d
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@jansahayak.gov.in}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-master_admin_secret_key_for_jansahayak_api_runner}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSIONS=768
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_ATLAS_VECTOR_SEARCH=false
      - SCHEME_REFRESH_ENABLED=false
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - jansahayak-net

  # --- JanSahayak Citizen Web Interface ---
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: jansahayak-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - jansahayak-net

volumes:
  # Persistent volume for scheme data, user accounts, and change events
  mongo-data:
    name: jansahayak-mongo-data
  # Persistent volume for Ollama model weights (~274 MB for nomic-embed-text)
  ollama-models:
    name: jansahayak-ollama-models

networks:
  jansahayak-net:
    driver: bridge
